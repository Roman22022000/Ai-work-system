<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Telegram Booking App</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;

    background:
    linear-gradient(
        135deg,
        #0f172a 0%,
        #1e3a8a 35%,
        #2563eb 65%,
        #38bdf8 100%
    );

    display:flex;
    justify-content:center;
    align-items:center;

    padding:16px;

    color:white;
}

.container{
    width:100%;
    max-width:500px;
}

.card{

    background:rgba(17,24,39,0.75);

    backdrop-filter:blur(14px);

    border:1px solid rgba(255,255,255,0.08);

    border-radius:24px;

    padding:24px;

    box-shadow:
    0 10px 40px rgba(0,0,0,0.35);
}

h1{
    text-align:center;
    margin-bottom:24px;
    font-size:28px;
    font-weight:700;
}

label{
    display:block;
    margin-bottom:8px;
    margin-top:18px;

    font-size:14px;

    color:#dbeafe;
}

input{
    width:100%;

    padding:15px;

    border:none;

    border-radius:14px;

    background:rgba(255,255,255,0.08);

    color:white;

    font-size:16px;

    transition:0.2s;
}

input::placeholder{
    color:#cbd5e1;
}

input:focus{

    outline:none;

    background:rgba(255,255,255,0.12);

    border:1px solid #60a5fa;
}

.submit{

    width:100%;

    margin-top:28px;

    padding:16px;

    border:none;

    border-radius:16px;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    color:white;

    background:
    linear-gradient(
        90deg,
        #2563eb,
        #3b82f6,
        #38bdf8
    );

    transition:0.25s;
}

.submit:hover{
    transform:translateY(-2px);
}

.success{

    display:none;

    margin-top:18px;

    padding:14px;

    border-radius:14px;

    background:rgba(34,197,94,0.2);

    border:1px solid rgba(34,197,94,0.4);

    color:#dcfce7;

    text-align:center;
}

@media(max-width:480px){

    .card{
        padding:20px;
    }

    h1{
        font-size:24px;
    }

    input{
        font-size:15px;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Бронирование</h1>

        <form id="bookingForm">

            <label>Имя</label>
            <input
                type="text"
                id="name"
                placeholder="Введите имя"
                required
            >

            <label>Номер телефона</label>
            <input
                type="tel"
                id="phone"
                placeholder="+7 999 999 99 99"
                required
            >

            <label>Адрес</label>
            <input
                type="text"
                id="address"
                placeholder="Введите адрес"
                required
            >

            <label>Дата</label>
            <input
                type="date"
                id="date"
                required
            >

            <label>Время</label>
            <input
                type="time"
                id="time"
                required
            >

            <button
                type="submit"
                class="submit"
            >
                Забронировать
            </button>

        </form>

        <div
            class="success"
            id="success"
        >
            Бронирование успешно отправлено
        </div>

    </div>

</div>

<script>

const tg = window.Telegram.WebApp;

tg.expand();

document
.getElementById("bookingForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    const bookingData = {

        name:
        document.getElementById("name").value,

        phone:
        document.getElementById("phone").value,

        address:
        document.getElementById("address").value,

        date:
        document.getElementById("date").value,

        time:
        document.getElementById("time").value
    };

    console.log(bookingData);

    tg.sendData(
        JSON.stringify(bookingData)
    );

    document
    .getElementById("success")
    .style.display = "block";
});

</script>

</body>
</html>
